@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;color:var(--chalk-white);font-family:var(--font-hand);font-size:1.15rem;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
a{color:var(--cloud-blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--sun-yellow);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 var(--gutter)}
.small{font-size:.98rem}
.muted{color:var(--chalk-muted)}
h1,h2,h3{font-weight:400}

/* template notice */
.tbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px;padding:max(8px,env(safe-area-inset-top,0px)) var(--gutter) 8px;background:color-mix(in srgb,var(--sun-yellow) 14%,var(--chalkboard-dark));color:var(--sun-yellow);font-size:1rem;text-align:center}
.tbar button{min-height:36px;padding:2px 12px;border:2px dashed color-mix(in srgb,var(--sun-yellow) 70%,transparent);border-radius:8px;background:none;color:var(--sun-yellow);font-family:var(--font-chalk);cursor:pointer}

/* owner-area chrome (mirrors the real admin) */
.adminHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:18px;padding-bottom:6px}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-chalk);font-size:1.7rem;color:var(--chalk-white);text-decoration:none}
.brand .sun{width:26px;height:26px;border-radius:50%;background:var(--sun-yellow);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun-yellow) 25%,transparent)}
.ownerTag{font-family:var(--font-chalk);color:var(--chalk-muted);font-size:1.05rem}
.adminNav{display:flex;gap:8px;overflow-x:auto;padding:10px var(--gutter) 14px;max-width:1040px;margin:0 auto;scrollbar-width:none}
.adminNav::-webkit-scrollbar{display:none}
.adminNav a,.adminNav button{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:4px 14px;border:2px solid var(--chalk-faint);border-radius:9px 12px 10px 11px;background:none;color:var(--chalk-white);font-family:var(--font-chalk);font-size:1.05rem;text-decoration:none;cursor:pointer;white-space:nowrap}
.adminNav [aria-current="page"]{border-color:var(--sun-yellow);color:var(--sun-yellow)}
.adminNav .new{margin-left:6px;font-size:.8rem;padding:0 6px;border-radius:6px;background:var(--sun-yellow);color:var(--chalkboard-dark)}

/* shared bits */
.h1{margin:0;font-family:var(--font-chalk);font-size:clamp(2.2rem,6vw,3rem);line-height:1.1}
.h2{margin:0;font-family:var(--font-chalk);font-size:clamp(1.65rem,4.6vw,2.1rem);line-height:1.15}
.sec{margin-top:clamp(30px,5vw,46px)}
.card{background:var(--card);border:2px dashed var(--chalk-faint);border-radius:10px 14px 11px 13px;padding:16px clamp(14px,3vw,20px)}
.cardH{margin:0 0 8px;font-family:var(--font-chalk);font-size:1.55rem}
.label{display:block;font-family:var(--font-chalk);font-size:1.05rem;margin:10px 0 4px}
.input{width:100%;min-height:44px;padding:8px 12px;border:2px solid color-mix(in srgb,var(--chalk-white) 35%,transparent);border-radius:6px 10px 7px 9px;background:color-mix(in srgb,var(--chalkboard-dark) 60%,transparent);font-family:var(--font-hand);font-size:1.1rem;color:var(--chalk-white)}
.input:focus-visible{outline:none;border-color:var(--sun-yellow)}
textarea.input{resize:vertical;line-height:1.4}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--chalk-dim) 50%),linear-gradient(135deg,var(--chalk-dim) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
select.input option,select.input optgroup{background:var(--chalkboard-dark);color:var(--chalk-white)}
.smallButton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 14px;border:2px solid color-mix(in srgb,var(--chalk-white) 40%,transparent);border-radius:8px;background:none;color:var(--chalk-white);font-family:var(--font-chalk);font-size:1.05rem;cursor:pointer;text-decoration:none}
.smallButton:hover{border-color:var(--sun-yellow);color:var(--sun-yellow)}
.smallButton.danger:hover,.linkButton.danger:hover{border-color:var(--chalk-error);color:var(--chalk-error)}
.addButton{display:inline-flex;align-items:center;min-height:52px;padding:0 20px;border:2px dashed var(--sun-yellow);border-radius:10px;background:none;color:var(--sun-yellow);font-family:var(--font-chalk);font-size:1.25rem;cursor:pointer;text-decoration:none}
.linkButton{min-height:44px;padding:0 4px;border:0;background:none;color:var(--cloud-blue);font-family:var(--font-chalk);font-size:1.05rem;text-decoration:underline;text-decoration-style:wavy;text-underline-offset:4px;cursor:pointer}
.kicker{margin:0 0 4px;font-family:var(--font-chalk);color:var(--sun-yellow);font-size:1.05rem;letter-spacing:.02em}
.crumbs{margin:6px 0 14px;font-size:1.02rem}
.crumbs a{color:var(--cloud-blue)}
.swatches{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 0}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:1rem;color:var(--chalk-muted)}
.sw i{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--chalk-faint);display:inline-block}
.bar{height:8px;border-radius:6px;background:var(--chalk-faint);overflow:hidden;margin:10px 0 4px}
.bar span{display:block;height:100%;background:var(--sun-yellow);border-radius:6px;transition:width .3s}

/* custom tick */
.tick{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:2px 0 0;border:2px solid var(--chalk-dim);border-radius:6px 8px 7px 9px;background:color-mix(in srgb,var(--chalkboard-dark) 55%,transparent);display:grid;place-items:center;cursor:pointer}
.tick:checked{background:var(--sun-yellow);border-color:var(--sun-yellow)}
.tick::after{content:"";width:7px;height:13px;border:solid var(--chalkboard-dark);border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg);opacity:0}
.tick:checked::after{opacity:1}

/* ---------- shoots list ---------- */
.listTop{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:8px}
.listTop .muted{margin:8px 0 0;max-width:40em}
.dayGrid{display:grid;gap:16px;margin-top:16px}
@media (min-width:860px){.dayGrid{grid-template-columns:1fr 1fr}}
.dayCard{display:flex;flex-direction:column}
.dayHead{text-decoration:none;color:var(--chalk-white);font-family:var(--font-chalk);font-size:1.75rem;line-height:1.1}
.dayHead .d2{color:var(--sun-yellow)}
.dayCard .meta{margin:4px 0 0}
.sessList{list-style:none;margin:12px 0 6px;padding:0;display:grid;gap:6px}
.sessList a{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:2px solid var(--chalk-faint);color:var(--chalk-white);text-decoration:none;min-height:52px}
.sessList a:hover{border-color:var(--cloud-blue)}
.sessList .t{font-family:var(--font-chalk);color:var(--sun-yellow)}
.sessList .f{line-height:1.2}
.sessList .f small{display:block;color:var(--chalk-muted);font-size:.92rem}
.sessList .st{font-size:.92rem;color:var(--chalk-muted);text-align:right}
.sessList .st.warn{color:var(--sun-yellow)}
.dayCard .cta{margin-top:auto;align-self:flex-start}
.newForm{margin-top:14px}
.newForm .grid{display:grid;gap:0 14px}
@media (min-width:700px){.newForm .grid{grid-template-columns:1fr 1fr}}
.newForm .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* ---------- day sheet ---------- */
.sheet{max-width:760px;margin:0 auto}
.sheetHead{padding:6px 0 14px}
.sheetHead .eyebrow{margin:0 0 6px;font-family:var(--font-chalk);color:var(--chalk-muted);font-size:1rem;letter-spacing:.08em;text-transform:uppercase}
.bigDate{margin:0;font-family:var(--font-chalk);font-size:clamp(2.3rem,8vw,3.4rem);line-height:1.05}
.bigDate .d2{color:var(--sun-yellow)}
.sheetHead .sum{margin:8px 0 0;color:var(--chalk-muted)}
.sheetHead .stats{margin:6px 0 0}
.sheetHead .stats b{font-family:var(--font-chalk);color:var(--sun-yellow);font-weight:400;font-size:1.2rem}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1 * var(--gutter));padding:10px var(--gutter);background:color-mix(in srgb,var(--chalkboard) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:2px dashed var(--chalk-faint);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:4px 14px;border:2px solid var(--chalk-faint);border-radius:20px;background:color-mix(in srgb,var(--chalkboard-dark) 50%,transparent);color:var(--chalk-white);font-family:var(--font-chalk);font-size:1rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.chip[aria-current="true"]{border-color:var(--sun-yellow);color:var(--sun-yellow)}
.sheet section[data-tabsec]{scroll-margin-top:calc(var(--tabs-h) + 8px)}
.sheet .card{margin-top:16px}
.whoList,.confirmList{margin:0;padding-left:1.2em}
.whoList li,.confirmList li{margin:4px 0}
.whoList b{font-weight:400;font-family:var(--font-chalk);color:var(--chalk-white);font-size:1.15rem}
.confirm{border-color:color-mix(in srgb,var(--sun-yellow) 55%,transparent);background:color-mix(in srgb,var(--sun-yellow) 8%,var(--card))}
.confirm .cardH{color:var(--sun-yellow)}
.confirmList b{font-weight:400;color:var(--sun-yellow)}
.session{margin-top:34px;padding-top:22px;border-top:2px solid color-mix(in srgb,var(--sun-yellow) 55%,transparent)}
.sessName{margin:0;font-family:var(--font-chalk);font-size:clamp(1.9rem,6vw,2.4rem);line-height:1.1}
.addr{margin:4px 0 0;color:var(--chalk-muted)}
.addr .ref{font-size:.95rem}
.note{margin-top:12px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--chalkboard-dark) 45%,transparent);border:2px solid var(--chalk-faint)}
.noteH{margin:0 0 2px;font-size:1rem;color:var(--chalk-muted);font-family:var(--font-hand)}
.note p{margin:0}
.pick{display:flex;align-items:center;gap:10px;margin-top:10px}
.orderH{margin:22px 0 2px;font-family:var(--font-chalk);font-size:1.45rem}
.orderH .muted{font-size:1.05rem;margin-left:6px}
.help{margin:0 0 10px;font-size:1rem;color:var(--chalk-muted)}
.setups{display:grid;gap:10px}
.setup{border:2px solid var(--chalk-faint);border-radius:10px 13px 11px 12px;background:var(--card)}
.setup[open]{border-color:color-mix(in srgb,var(--cloud-blue) 55%,transparent)}
.setup summary{list-style:none;display:grid;grid-template-columns:64px 1fr 28px;gap:8px;align-items:center;padding:12px 14px;cursor:pointer;min-height:60px}
.setup summary::-webkit-details-marker{display:none}
.stime{font-family:var(--font-chalk);color:var(--sun-yellow);font-size:1.3rem}
.stitle{font-family:var(--font-chalk);font-size:1.25rem;line-height:1.2}
.stitle small{display:block;font-family:var(--font-hand);color:var(--chalk-muted);font-size:.95rem;margin-top:2px}
.stitle small .allDone{color:var(--sun-yellow)}
.chev{width:12px;height:12px;border:solid var(--chalk-dim);border-width:0 2.5px 2.5px 0;transform:rotate(45deg);justify-self:center;transition:transform .2s}
.setup[open] .chev{transform:rotate(-135deg)}
.setupBody{padding:0 14px 14px;border-top:2px dashed var(--chalk-faint)}
.setupNote{margin:10px 0 4px;color:var(--chalk-muted);font-size:1.02rem}
.lbl{margin:14px 0 6px;font-family:var(--font-chalk);font-size:1.05rem;color:var(--chalk-muted)}
.shots{list-style:none;margin:0;padding:0;border:2px solid var(--chalk-faint);border-radius:10px;overflow:hidden}
.shot{padding:12px;border-top:2px solid var(--chalk-faint)}
.shot:first-child{border-top:0}
.shotTop{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.shotText{display:grid;gap:2px;min-width:0}
.shotTitle{font-size:1.18rem;line-height:1.25}
.tags{display:inline-flex;flex-wrap:wrap;gap:6px;margin-left:6px;vertical-align:2px}
.tag{font-size:.85rem;padding:0 8px;border-radius:6px;border:1.5px solid color-mix(in srgb,var(--cloud-blue) 70%,transparent);color:var(--cloud-blue);line-height:1.5}
.tag.hot{border-color:var(--sun-yellow);color:var(--chalkboard-dark);background:var(--sun-yellow)}
.who,.sub{color:var(--chalk-muted);font-size:1rem}
.desc{font-size:1.05rem}
.shot.done .shotText{opacity:.5}
.shot.done .shotTitle{text-decoration:line-through;text-decoration-thickness:2px}
.strip{display:flex;gap:8px;overflow-x:auto;margin:10px 0 0 38px;padding-bottom:4px;scrollbar-width:thin}
.ph{position:relative;flex:none}
.thumb{display:block;position:relative;padding:0;border:0;background:var(--chalkboard-dark);border-radius:7px;overflow:hidden;cursor:zoom-in}
.thumb img,.thumb video{display:block;width:84px;height:112px;object-fit:cover;pointer-events:none}
.thumb.sm img{width:56px;height:74px}
.play{position:absolute;inset:auto auto 6px 6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6)}
.play::after{content:"";position:absolute;left:9px;top:6px;border-style:solid;border-width:6px 0 6px 9px;border-color:transparent transparent transparent #fff}
.phTick{position:absolute;top:2px;right:2px;width:44px;height:44px;padding:0;border:0;background:none;cursor:pointer}
.phTick::before{content:"";position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(15,40,23,.45)}
.phTick::after{content:"";position:absolute;top:9px;right:12px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);opacity:.85}
.phTick[aria-pressed="true"]::before{background:var(--sun-yellow);border-color:var(--sun-yellow)}
.phTick[aria-pressed="true"]::after{border-color:var(--chalkboard-dark);opacity:1}
.ph.done .thumb{opacity:.45}
.shot.done .ph .thumb{opacity:.4}
.linkCard{display:flex;align-items:center;gap:10px;margin:10px 0 0 38px;padding:8px 12px;border:2px solid color-mix(in srgb,var(--cloud-blue) 45%,transparent);border-radius:9px;text-decoration:none;color:var(--chalk-white);max-width:420px}
.linkCard .lcIcon{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--cloud-blue) 20%,transparent);color:var(--cloud-blue);font-size:.9rem}
.linkCard .lcPlat{display:block;font-family:var(--font-chalk);color:var(--cloud-blue);font-size:1rem;line-height:1.1}
.linkCard .lcText{display:block;font-size:.98rem;color:var(--chalk-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}
.checklist{list-style:none;margin:0;padding:0;border:2px solid var(--chalk-faint);border-radius:10px;overflow:hidden;background:var(--card)}
.checklist li{border-top:2px solid var(--chalk-faint)}
.checklist li:first-child{border-top:0}
.checklist label{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;cursor:pointer}
.checklist li.done label span{opacity:.5;text-decoration:line-through;text-decoration-thickness:2px}
.checklist .group{padding:8px 12px 4px;font-family:var(--font-chalk);color:var(--sun-yellow);background:color-mix(in srgb,var(--chalkboard-dark) 45%,transparent)}
.unsorted{margin-top:16px}
.unsorted .strip{margin-left:0}
.folderLink{margin:16px 0 0}
.block{margin-top:40px;padding-top:22px;border-top:2px solid color-mix(in srgb,var(--sun-yellow) 55%,transparent)}
.block .muted{margin:4px 0 12px}
.empty{margin-top:14px;padding:16px;border:2px dashed color-mix(in srgb,var(--sun-yellow) 55%,transparent);border-radius:10px;color:var(--chalk-muted)}
.bullets{margin:4px 0 0;padding-left:1.2em}
.clearRow{margin-top:22px}

/* ---------- folder ---------- */
.folderHead .muted{margin:6px 0 0}
.folderActions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.folderGrid{display:grid;gap:26px;margin-top:22px}
@media (min-width:960px){.folderGrid{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);align-items:start}.colSide{position:sticky;top:12px}}
.dropZone{display:grid;place-items:center;gap:4px;min-height:150px;padding:20px;border:3px dashed var(--sun-yellow);border-radius:14px 18px 15px 17px;text-align:center;cursor:pointer;background:color-mix(in srgb,var(--sun-yellow) 5%,transparent)}
.dropZone.over{background:color-mix(in srgb,var(--sun-yellow) 16%,transparent)}
.dropZone:focus-within{outline:2px dashed var(--sun-yellow);outline-offset:4px}
.dzBig{font-family:var(--font-chalk);font-size:1.5rem;color:var(--sun-yellow);line-height:1.15}
.linkRow{display:flex;gap:8px}
.linkRow .input{flex:1;min-width:0}
.formMsg{min-height:1.4em;margin:6px 0 0}
.formMsg.err{color:var(--chalk-error)}
.inspoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;margin-top:12px}
.inspoCard{padding:10px;display:flex;flex-direction:column;gap:2px}
.inspoCard .thumb{width:100%}
.inspoCard .thumb img,.inspoCard .thumb video{width:100%;height:auto;aspect-ratio:3/4}
.inspoCard .label{font-size:.98rem;margin:8px 0 2px}
.inspoCard .input{font-size:1rem;min-height:40px;padding:6px 10px}
.inspoCard.unsortedCard{border-color:color-mix(in srgb,var(--sun-yellow) 55%,transparent)}
.linkVis{display:grid;place-items:center;gap:4px;width:100%;aspect-ratio:3/4;padding:10px;background:color-mix(in srgb,var(--cloud-blue) 14%,var(--chalkboard-dark));color:var(--cloud-blue);text-align:center;font-family:var(--font-chalk);font-size:1.15rem;cursor:pointer}
.linkVis small{font-family:var(--font-hand);color:var(--chalk-muted);font-size:.85rem;word-break:break-all;line-height:1.2}
.notice{margin:10px 0 0;padding:10px 12px;border-radius:9px;border:2px dashed color-mix(in srgb,var(--sun-yellow) 55%,transparent);color:var(--sun-yellow);font-size:1.02rem}
.setupEd{margin-top:12px}
.seRow{display:grid;grid-template-columns:118px 1fr;gap:10px}
.seRow .label{margin-top:0}
.shotEds{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.shotEd{display:grid;grid-template-columns:130px 1fr 44px;gap:6px 8px;align-items:center;padding:8px;border:2px solid var(--chalk-faint);border-radius:9px}
.shotEd .detail{grid-column:1 / 3}
.shotEd .count{grid-column:3;text-align:center;font-size:.9rem;color:var(--chalk-muted);line-height:1.1}
.iconBtn{width:44px;height:44px;border:2px solid var(--chalk-faint);border-radius:8px;background:none;color:var(--chalk-muted);font-size:1.3rem;cursor:pointer}
.iconBtn:hover{border-color:var(--chalk-error);color:var(--chalk-error)}
.seActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
@media (max-width:420px){.shotEd{grid-template-columns:1fr 44px}.shotEd .kind{grid-column:1}.shotEd .title{grid-column:1 / 3}.shotEd .detail{grid-column:1 / 2}}
.fromBooking dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.fromBooking dt{color:var(--chalk-muted)}
.fromBooking dd{margin:0}
.colSide .card+.card{margin-top:16px}
.hint{font-size:.95rem;color:var(--chalk-muted);margin:2px 0 0}
.saved{margin:12px 0 0;font-size:1rem;color:var(--chalk-muted)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;display:grid;grid-template-rows:auto 1fr auto;background:rgba(6,18,10,.94);padding:max(12px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom))}
.lb[hidden]{display:none}
.lbTop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lbCount{color:var(--chalk-muted);font-size:1rem}
.lbStage{display:grid;place-items:center;min-height:0;position:relative}
.lbStage img,.lbStage video{max-width:100%;max-height:72vh;border-radius:10px;object-fit:contain;background:#000}
.lbStage .linkVis{max-width:320px}
.lbNav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border:0;border-radius:10px;background:rgba(0,0,0,.35);color:#fff;font-size:1.8rem;cursor:pointer}
.lbPrev{left:0}.lbNext{right:0}
.lbBottom{text-align:center;padding-top:10px}
.lbCap{margin:0 0 10px;font-family:var(--font-chalk);font-size:1.25rem}
.lbCap small{display:block;font-family:var(--font-hand);color:var(--chalk-muted);font-size:1rem}
.lbTick[aria-pressed="true"]{background:var(--sun-yellow);border-color:var(--sun-yellow);color:var(--chalkboard-dark)}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;z-index:120;max-width:min(92vw,460px);padding:10px 16px;border-radius:10px;background:var(--chalkboard-dark);border:2px solid var(--sun-yellow);color:var(--chalk-white);font-size:1.05rem;transition:opacity .2s,transform .2s;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- v2 additions ---------- */
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 18px}
.subtabs a{display:inline-flex;align-items:center;min-height:44px;padding:4px 16px;border-radius:22px;border:2px solid var(--chalk-faint);color:var(--chalk-white);text-decoration:none;font-family:var(--font-chalk);font-size:1.1rem}
.subtabs a[aria-current="page"]{border-color:var(--sun-yellow);color:var(--sun-yellow)}
.facts{display:flex;flex-wrap:wrap;gap:6px 8px;margin:10px 0 0;padding:0;list-style:none}
.facts li{padding:2px 10px;border-radius:8px;border:1.5px solid var(--chalk-faint);font-size:1rem;color:var(--chalk-muted)}
.facts li b{font-weight:400;color:var(--chalk-white)}
.stageSum{font-size:.95rem;color:var(--chalk-muted)}
.setup.kind-arrive,.setup.kind-pack{border-style:dashed}
.setup.kind-switch summary,.setup.kind-welcome summary,.setup.kind-wrap summary{min-height:52px}
.setup.kind-switch .stitle,.setup.kind-welcome .stitle,.setup.kind-wrap .stitle,.setup.kind-pack .stitle{font-size:1.12rem;color:var(--chalk-muted)}
.stime small{display:block;font-family:var(--font-hand);color:var(--chalk-muted);font-size:.85rem;line-height:1}
.steps{margin-top:10px}
.shotGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:8px}
.shotCard{position:relative;display:flex;flex-direction:column;gap:4px}
.shotCard .thumb img,.shotCard .thumb video{width:100%;height:auto;aspect-ratio:3/4}
.shotCard .thumb{width:100%}
.shotCard .linkVis{aspect-ratio:3/4;border-radius:7px;text-decoration:none;font-size:1.05rem}
.shotCard .cap{margin:0;font-size:.98rem;line-height:1.25}
.shotCard.done .thumb,.shotCard.done .linkVis{opacity:.45}
.shotCard.done .cap{opacity:.55;text-decoration:line-through}
.noteShots{margin-top:10px}
.planList{list-style:none;margin:12px 0 0;padding:0;border:2px solid var(--chalk-faint);border-radius:10px;overflow:hidden;background:var(--card)}
.planList li{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:2px solid var(--chalk-faint)}
.planList li:first-child{border-top:0}
.planList .pt{font-family:var(--font-chalk);color:var(--sun-yellow);font-size:1.15rem}
.planList .pn{line-height:1.2}
.planList .pn small{display:block;color:var(--chalk-muted);font-size:.92rem}
.planList li.minor .pn{color:var(--chalk-muted)}
.planList li.extra{background:color-mix(in srgb,var(--cloud-blue) 8%,transparent)}
.exForm{margin-top:12px;display:grid;gap:0 10px;grid-template-columns:1fr 1fr}
.exForm .full{grid-column:1 / -1}
.exForm .actions{grid-column:1 / -1;display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.dropCard .smallLink{margin-top:4px}
.presetGrid{display:grid;gap:16px}
@media (min-width:960px){.presetGrid{grid-template-columns:1fr 1fr;align-items:start}}
.timing{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 12px}
.timing .input{max-width:140px}
.preview .planList{margin-top:8px}
.bringGroup{margin-top:4px}
.warnTxt{color:var(--sun-yellow)}
.linkVis.noteVis{aspect-ratio:auto;min-height:72px;cursor:default}
@media (max-width:560px){
  .inspoGrid{grid-template-columns:1fr}
  .inspoCard{display:grid;grid-template-columns:104px minmax(0,1fr);column-gap:12px;align-items:start}
  .inspoCard > .thumb,.inspoCard > .linkVis{grid-row:1 / span 6;grid-column:1;width:104px}
  .inspoCard > :not(.thumb):not(.linkVis){grid-column:2}
  .inspoCard .label:first-of-type{margin-top:0}
  .inspoCard .linkButton{justify-self:start}
}

.dropZone.dzSmall{min-height:100px}
.dropZone.dzSmall .dzBig{font-size:1.25rem}
.sheet .orderH .muted{font-size:1.05rem}
/* ---------- waiver ---------- */
.kiosk{position:fixed;inset:0;z-index:300;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:radial-gradient(120% 80% at 50% 0%,var(--chalkboard-light) 0%,var(--chalkboard) 60%)}
.kiosk[hidden]{display:none}
.kioskBar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:max(10px,env(safe-area-inset-top,0px)) var(--gutter) 10px;background:color-mix(in srgb,var(--chalkboard-dark) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:2px dashed var(--chalk-faint)}
.brand.small{font-size:1.3rem}.brand.small .sun{width:20px;height:20px}
.ownerBox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ownerTag.small{font-size:.9rem}
.kioskBody{max-width:780px;margin:0 auto;padding:20px var(--gutter) calc(60px + env(safe-area-inset-bottom,0px))}
.paper{background:#fbf7ee;color:#1d2a20;border-radius:12px 16px 13px 15px;padding:clamp(20px,4.5vw,40px);box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:1.2rem;line-height:1.5}
.paper p{margin:0 0 10px}
.paperBrand{margin:0!important;font-family:var(--font-chalk);color:#2e5a3d;font-size:1.1rem}
.paperTitle{margin:2px 0 12px;font-family:var(--font-chalk);font-weight:400;font-size:clamp(1.9rem,5vw,2.5rem);line-height:1.1;color:#183a22}
.paperH{margin:26px 0 8px;font-family:var(--font-chalk);font-weight:400;font-size:1.45rem;color:#183a22}
.paperFacts{padding:8px 12px;border-radius:8px;background:#f1eadb;font-size:1.05rem}
.paperFacts b{font-weight:400;color:#183a22}
.paperFine{font-size:1.02rem;color:#3a463c}
.paperList{margin:0;padding-left:1.2em}.paperList li{margin:6px 0}
.paperHint{margin:6px 0 0!important;font-size:1rem;color:#5b665d}
.paperLabel{display:block;margin:16px 0 6px;font-family:var(--font-chalk);font-size:1.15rem;color:#183a22}
.pin{width:100%;min-height:52px;padding:10px 14px;border:2px solid #cfc6b2;border-radius:10px;background:#fff;color:#1d2a20;font-family:var(--font-hand);font-size:1.2rem}
textarea.pin{resize:vertical}
.pin:focus-visible{outline:none;border-color:#2e5a3d;box-shadow:0 0 0 3px rgba(46,90,61,.25)}
.paper :focus-visible{outline-color:#2e5a3d}
.wvList{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.wvChoice{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid #e2d9c6;border-radius:10px;background:#fff;cursor:pointer;min-height:52px}
.paper .tick{border-color:#8a9488;background:#fff}
.paper .tick:checked{background:#2e5a3d;border-color:#2e5a3d}
.paper .tick::after{border-color:#fff}
.wvChoice.on .wvMark{color:#2e5a3d}.wvChoice.off{opacity:.55}
.wvMark{flex:none;font-family:var(--font-chalk);font-size:1.3rem;width:26px;text-align:center;line-height:1.2}
.wvChoice.agree{margin-top:18px;border-color:#2e5a3d}
.paperBtn{min-height:48px;padding:6px 18px;border:2px solid #2e5a3d;border-radius:10px;background:#fff;color:#2e5a3d;font-family:var(--font-chalk);font-size:1.15rem;cursor:pointer;margin-bottom:10px}
.paperBtn.small{min-height:44px;margin:0;font-size:1rem;padding:4px 14px}
.seg{display:inline-flex;border:2px solid #cfc6b2;border-radius:10px;overflow:hidden}
.seg button{min-height:48px;padding:6px 18px;border:0;background:#fff;color:#1d2a20;font-family:var(--font-hand);font-size:1.15rem;cursor:pointer}
.seg button+button{border-left:2px solid #cfc6b2}
.seg button[aria-checked="true"]{background:#2e5a3d;color:#fff}
.sigHead{display:flex;justify-content:space-between;align-items:center;margin:20px 0 6px}
.sigBox{position:relative;height:210px;border:2px dashed #8a9488;border-radius:12px;background:#fff}
.sigBox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;z-index:1}
.sigBox::after{content:"";position:absolute;left:44px;right:20px;bottom:48px;border-bottom:2px solid #d8d0bd;pointer-events:none}
.sigX{position:absolute;left:18px;bottom:42px;color:#8a9488;font-size:1.2rem;pointer-events:none}
.sigBox.done{height:auto;padding:10px;border-style:solid;border-color:#e2d9c6}
.sigBox.done img{display:block;max-width:100%;max-height:160px;margin:0 auto}
.sigBox.done::after{display:none}
.paperMeta{margin:10px 0 0!important;font-size:.98rem;color:#5b665d}
.paperMissing{min-height:1.4em;margin:12px 0 0!important;color:#9a3b2a;font-size:1.02rem}
.paperMissing.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.doneBtn{display:block;width:100%;min-height:60px;margin-top:8px;border:0;border-radius:12px;background:#2e5a3d;color:#fff;font-family:var(--font-chalk);font-size:1.5rem;cursor:pointer}
.doneBtn[aria-disabled="true"]{background:#b9c0b5;color:#f8f6f0}
.thanks{text-align:center;padding-top:clamp(60px,16vh,140px)}
.bigSun{width:90px;height:90px;margin:0 auto 26px;border-radius:50%;background:var(--sun-yellow);box-shadow:0 0 0 14px color-mix(in srgb,var(--sun-yellow) 22%,transparent),0 0 0 30px color-mix(in srgb,var(--sun-yellow) 10%,transparent)}
.thanksSub{font-size:1.35rem;color:var(--chalk-muted);max-width:28em;margin:14px auto 0}
.nextBtn{border-color:var(--sun-yellow)!important;color:var(--sun-yellow)!important}
.waiverCard{margin-bottom:16px}
.waiverCard .wvState{margin:0;font-family:var(--font-chalk);font-size:1.35rem}
.wvState.warn{color:var(--sun-yellow)}.wvState.ok{color:#8fe0a6}
.wvBtn{width:100%;justify-content:center;margin-top:10px}
.facts li.yes{color:var(--chalk-white)}.facts li.no{opacity:.55;text-decoration:line-through}
.sigThumb{display:block;max-width:220px;max-height:80px;margin:10px 0 4px;padding:6px 10px;background:#fbf7ee;border-radius:8px}
.wvLine{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;margin-top:12px;padding:6px 6px 6px 12px;border-radius:10px;border:2px solid var(--chalk-faint)}
.wvLine.warn{border-color:color-mix(in srgb,var(--sun-yellow) 60%,transparent);color:var(--sun-yellow)}
.wvLine.ok{color:#8fe0a6}
@media (min-width:960px){.mobileOnly{display:none}}
</style>

function sizePad(c) {

    ctx.beginPath(); ctx.moveTo(lastMid.x, lastMid.y); ctx.quadraticCurveTo(last.x, last.y, mid.x, mid.y); ctx.stroke();

  const c = document.getElementById("sigPad"); if (!K.open || !c) return; const img = K.ink ? c.toDataURL() : null, ink = K.ink; setupPad(); if (img) redrawPad(img, ink); }, 200); });

function sectionCard(sec) {
  return `<section class="card sectionCard" style="margin-top:16px">
    <label class="label" for="sn-${sec.id}" style="margin-top:0">Section name</label>
    <input class="input" id="sn-${sec.id}" data-f="sec.name" data-id="${sec.id}" value="${esc(sec.name)}" placeholder="e.g. Christmas props">
    <label class="label" for="si-${sec.id}">What to bring</label>
    <textarea class="input" id="si-${sec.id}" rows="${Math.max(3, sec.items.length)}" data-f="sec.items" data-id="${sec.id}" aria-describedby="sh-${sec.id}">${esc(sec.items.join("\n"))}</textarea>
    <p class="hint" id="sh-${sec.id}">One per line.</p>
    <button type="button" class="linkButton danger" data-act="rm-section" data-id="${sec.id}">Remove this section</button>
  </section>`;
}
const notFound = () => `<p class="crumbs"><a href="#shoots">← All shoots</a></p><h1 class="h1">Not found</h1><p class="muted">That shoot isn't here any more.</p>`;

/* ---------- router ---------- */
let current = "";
const app = document.getElementById("app");
function render() {
  const h = location.hash.slice(1) || "shoots";
  if (h.startsWith("day-")) { const d = h.slice(4); app.innerHTML = viewDay(d); document.title = "Shoot day · " + d + " · Tiny Humans"; }
  else if (h.startsWith("folder-")) { const s = findSession(h.slice(7)); app.innerHTML = viewFolder(h.slice(7)); document.title = (s ? s.family : "Folder") + " · Shoots · Tiny Humans"; }
  else if (h === "bring") { app.innerHTML = viewBring(); document.title = "What we always bring · Shoots · Tiny Humans"; }
  else { app.innerHTML = viewList(); document.title = "Shoots · Owner area · Tiny Humans (template)"; }
  if (current !== h) window.scrollTo(0, 0);
  current = h;
  afterRender();
}
window.addEventListener("hashchange", render);
let observer;
function afterRender() {
  if (observer) observer.disconnect();
  const tabs = app.querySelector(".tabs");
  if (tabs) {
    document.documentElement.style.setProperty("--tabs-h", tabs.offsetHeight + "px");
    observer = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        tabs.querySelectorAll(".chip").forEach((c) => {
          const on = c.dataset.target === e.target.id;
          c.setAttribute("aria-current", on ? "true" : "false");
          if (on) tabs.scrollTo({ left: c.offsetLeft - tabs.clientWidth / 2 + c.offsetWidth / 2, behavior: "smooth" });
        });
      });
    }, { rootMargin: "-90px 0px -65% 0px" });
    app.querySelectorAll("[data-tabsec]").forEach((sec) => observer.observe(sec));
  }
  app.querySelectorAll("textarea.input").forEach(grow);
  app.querySelectorAll("[data-dz]").forEach((dz) => {
    ["dragenter", "dragover"].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add("over"); }));
    ["dragleave", "drop"].forEach((ev) => dz.addEventListener(ev, () => dz.classList.remove("over")));
    dz.addEventListener("drop", (e) => { e.preventDefault(); addFiles(e.dataTransfer.files, dz.dataset.dz); });
  });
}

/* ---------- ticks ---------- */
function setTick(key, on) { if (on) S.ticks[key] = 1; else delete S.ticks[key]; save(); syncTicks(); }
function syncTicks() {
  app.querySelectorAll("[data-tickrow]").forEach((el) => el.classList.toggle("done", !!S.ticks[el.dataset.tickrow]));
  app.querySelectorAll("input.tick").forEach((i) => { i.checked = !!S.ticks[i.dataset.tick]; });
  document.querySelectorAll("button[data-tick]").forEach((b) => b.setAttribute("aria-pressed", String(!!S.ticks[b.dataset.tick])));
  app.querySelectorAll("[data-groupcount]").forEach((el) => {
    const [sid, group] = el.dataset.groupcount.split("|"); const s = findSession(sid); if (!s) return;
    const c = countKeys(of(s, group).map((x) => "in:" + x.id)); el.textContent = c.done + "/" + c.total;
  });
  const dc = app.querySelector("[data-daycount]");
  if (dc) {
    const d = location.hash.slice(1).replace(/^day-/, ""), c = countKeys(dayKeys(d));
    dc.textContent = c.done; const bar = app.querySelector("[data-daybar]"); if (bar) bar.style.width = (c.total ? Math.round(c.done / c.total * 100) : 0) + "%";
  }
  if (LB.open) paintLightboxTick();
}

/* ---------- lightbox ---------- */
const LB = { open:false, list:[], i:0, mode:"", sid:"", back:null };
function openLight(spec, from) {
  const [mode, sid, iid] = spec.split(":");
  const s = findSession(sid); if (!s) return;
  if (mode === "pick") { LB.list = [{ id:"pick", type:"image", src:s.pick, caption:"Their pick when booking" }]; LB.i = 0; }
  else { const x = s.inspo.find((y) => y.id === iid); if (!x) return; LB.list = of(s, x.group).filter(visualOf); LB.i = LB.list.indexOf(x); }
  LB.mode = mode; LB.sid = sid; LB.back = from; LB.open = true;
  paintLightbox();
  const lb = document.getElementById("lb"); lb.hidden = false; document.body.style.overflow = "hidden";
  lb.querySelector('[data-act="lb-close"]').focus();
}
function paintLightbox() {
  const x = LB.list[LB.i]; if (!x) return;
  document.getElementById("lbStage").innerHTML = (x.type === "video" ? `<video src="${esc(srcOf(x))}" controls playsinline></video>` : `<img src="${esc(srcOf(x))}" alt="${esc(x.caption || "Inspo")}">`)
    + (LB.list.length > 1 ? `<button type="button" class="lbNav lbPrev" data-act="lb-prev" aria-label="Previous">‹</button><button type="button" class="lbNav lbNext" data-act="lb-next" aria-label="Next">›</button>` : "");
  document.getElementById("lbCount").textContent = LB.list.length > 1 ? (LB.i + 1) + " of " + LB.list.length : "";
  document.getElementById("lbCap").textContent = x.caption || "Inspo";
  paintLightboxTick();
}
function paintLightboxTick() {
  const x = LB.list[LB.i], btn = document.getElementById("lbTick"), can = LB.mode === "in" && x;
  btn.hidden = !can;
  if (can) { const on = !!S.ticks["in:" + x.id]; btn.setAttribute("aria-pressed", String(on)); btn.textContent = on ? "Done ✓" : "Mark as done"; }
}
function closeLight() {
  LB.open = false; document.getElementById("lb").hidden = true; document.body.style.overflow = "";
  document.getElementById("lbStage").innerHTML = "";
  if (LB.back && document.contains(LB.back)) LB.back.focus();
}
document.addEventListener("keydown", (e) => {
  if (!LB.open) return;
  if (e.key === "Escape") closeLight();
  if (e.key === "ArrowRight" && LB.list.length > 1) { LB.i = (LB.i + 1) % LB.list.length; paintLightbox(); }
  if (e.key === "ArrowLeft" && LB.list.length > 1) { LB.i = (LB.i - 1 + LB.list.length) % LB.list.length; paintLightbox(); }
  if (e.key === "Tab") {
    const f = [...document.getElementById("lb").querySelectorAll("button:not([hidden]),video[controls]")];
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ---------- editing ---------- */
const curSession = () => { const h = location.hash.slice(1); return h.startsWith("folder-") ? findSession(h.slice(7)) : null; };
const toLines = (v) => v.split("\n").map((t) => t.trim()).filter(Boolean);
function applyField(el) {
  const [scope, key] = el.dataset.f.split("."), v = el.value;
  if (scope === "sec") { const sec = S.sections.find((x) => x.id === el.dataset.id); if (sec) { if (key === "name") sec.name = v; else sec.items = toLines(v); } }
  else {
    const s = curSession(); if (!s) return;
    if (scope === "s") s[key] = v;
    else if (scope === "l") s[key] = toLines(v);
    else if (scope === "i") { const x = s.inspo.find((y) => y.id === el.dataset.id); if (x) x[key] = v; }
  }
  setSaved("Saving…"); save();
}
function refreshGroup(group) { const s = curSession(), el = document.getElementById("grp-" + group); if (s && el) el.innerHTML = groupCards(s, group); }
async function addFiles(fileList, group) {
  const s = curSession(); if (!s) return;
  const files = [...fileList].filter((f) => /^image\/|^video\//.test(f.type));
  if (!files.length) { toast("Only photos and videos can go in a folder."); return; }
  let added = 0;
  for (const f of files) {
    if (f.type.startsWith("video/")) { s.inspo.push({ id:newId("in"), group, type:"video", src:URL.createObjectURL(f), caption:"", temp:true }); added++; continue; }
    try { s.inspo.push({ id:newId("in"), group, type:"image", src:await shrink(f), caption:"" }); added++; }
    catch (e) { toast("Couldn't read " + f.name + "."); }
  }
  save(true); refreshGroup(group);
  if (added) toast(added === 1 ? "Added. Write what it is under the photo." : `Added ${added}. Write what each one is under the photo.`);
}
function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const r = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.8));
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    im.src = url;
  });
}
const armed = {};
function twoStep(btn, key, label, fn) {
  if (armed[key]) { clearTimeout(armed[key]); delete armed[key]; fn(); return; }
  const old = btn.textContent; btn.textContent = label;
  armed[key] = setTimeout(() => { delete armed[key]; if (document.contains(btn)) btn.textContent = old; }, 3500);
}
function grow(t) { t.style.height = "auto"; t.style.height = (t.scrollHeight + 4) + "px"; }
document.addEventListener("click", (e) => {
  const tickBtn = e.target.closest("button[data-tick]");
  if (tickBtn) { setTick(tickBtn.dataset.tick, tickBtn.getAttribute("aria-pressed") !== "true"); return; }
  const light = e.target.closest("[data-light]");
  if (light) { openLight(light.dataset.light, light); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const s = curSession();
  switch (el.dataset.act) {
    case "waiver": openKiosk(el.dataset.id); break;
    case "waiver-view": openWaiverView(el.dataset.id); break;
    case "waiver-redo": twoStep(el, "redo" + el.dataset.id, "Tap again to sign a new one", () => openKiosk(el.dataset.id)); break;
    case "k-close": closeKiosk(); break;
    case "k-cancel": twoStep(el, "kcancel", T[K.lang].cancelSure, () => closeKiosk()); break;
    case "k-lang": { const c = document.getElementById("sigPad"), img = K.ink ? c.toDataURL() : null, ink = K.ink; K.lang = K.lang === "en" ? "es" : "en"; const y = document.getElementById("kiosk").scrollTop; paintKiosk(); document.getElementById("kiosk").scrollTop = y; if (img) redrawPad(img, ink); break; }
    case "k-all": USES.forEach((u) => { K.uses[u.key] = true; }); document.querySelectorAll('#kiosk [data-k^="use:"]').forEach((i) => { i.checked = true; }); updateDone(); break;
    case "k-rel": K.rel = el.dataset.v; document.querySelectorAll('#kiosk [data-act="k-rel"]').forEach((b) => b.setAttribute("aria-checked", String(b === el))); break;
    case "k-clear": setupPad(); updateDone(); break;
    case "k-done": finishKiosk(); break;
    case "k-next": closeKiosk(); render(); toast("Waiver saved. On Leads, Photo use now says: Waiver signed."); break;
    case "jump": { const t = document.getElementById(el.dataset.target); if (t) t.scrollIntoView({ block:"start" }); break; }
    case "nav-other": toast("That page is already in your admin. This template only shows the new Shoots page."); break;
    case "nav-leads": toast("In the real admin, each lead in Leads gets an “Open shoot folder” button."); break;
    case "toggle-new": { const f = document.getElementById("newForm"), open = f.hidden; f.hidden = !open; el.closest("main").querySelector('[aria-controls="newForm"]').setAttribute("aria-expanded", String(open)); if (open) document.getElementById("nf-title").focus(); break; }
    case "reset": twoStep(el, "reset", "Tap again to reset", () => { try { localStorage.removeItem(KEY); } catch (err) {} start(true); toast("Sample data is back."); }); break;
    case "clear-ticks": twoStep(el, "clear", "Tap again to clear every tick on this day", () => { dayKeys(el.dataset.date).forEach((k) => delete S.ticks[k]); save(true); syncTicks(); el.textContent = "Clear all ticks"; toast("All ticks cleared for this day."); }); break;
    case "lb-close": closeLight(); break;
    case "lb-prev": LB.i = (LB.i - 1 + LB.list.length) % LB.list.length; paintLightbox(); break;
    case "lb-next": LB.i = (LB.i + 1) % LB.list.length; paintLightbox(); break;
    case "lb-tick": { const x = LB.list[LB.i]; if (x) setTick("in:" + x.id, !S.ticks["in:" + x.id]); break; }
    case "rm-inspo": if (s) { const x = s.inspo.find((y) => y.id === el.dataset.id); s.inspo = s.inspo.filter((y) => y !== x); save(true); if (x) refreshGroup(x.group); toast("Removed."); } break;
    case "add-section": {
      const sec = { id:newId("sec"), name:"", items:[] }; S.sections.push(sec); save(true);
      document.getElementById("sections").insertAdjacentHTML("beforeend", sectionCard(sec));
      const inp = document.getElementById("sn-" + sec.id); if (inp) { inp.focus(); inp.scrollIntoView({ block:"center" }); }
      break;
    }
    case "rm-section": twoStep(el, "rmsec" + el.dataset.id, "Tap again to remove it from every day sheet", () => {
      S.sections = S.sections.filter((x) => x.id !== el.dataset.id); save(true);
      const card = el.closest(".sectionCard"); if (card) card.remove(); toast("Section removed.");
    }); break;
    case "add-note": if (s) { const g = el.dataset.group, x = { id:newId("in"), group:g, type:"note", caption:"" }; s.inspo.push(x); save(true); refreshGroup(g); const inp = document.getElementById("c-" + x.id); if (inp) { inp.focus(); inp.scrollIntoView({ block:"center" }); } } break;
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.matches("[data-k]")) { const k = t.dataset.k; if (k.startsWith("use:")) K.uses[k.slice(4)] = t.checked; else if (k === "firstName") K.firstName = t.checked; else if (k === "agree") K.agree = t.checked; updateDone(); return; }
  if (t.matches("input.tick")) { setTick(t.dataset.tick, t.checked); return; }
  if (t.matches("[data-file]")) { addFiles(t.files, t.dataset.file); t.value = ""; return; }
});
document.addEventListener("input", (e) => { const t = e.target; if (t.tagName === "TEXTAREA") grow(t); if (t.matches("[data-k]") && t.dataset.k === "name") { K[t.dataset.k] = t.value; updateDone(); return; } if (t.matches("[data-f]")) applyField(t); });
document.addEventListener("submit", (e) => {
  const form = e.target.closest("[data-form]"); if (!form) return;
  e.preventDefault();
  const s = curSession();
  if (form.dataset.form === "link" && s) {
    const g = form.dataset.group, inp = document.getElementById("link-" + g), msg = document.getElementById("msg-" + g), url = inp.value.trim(), plat = platformOf(url);
    if (!url || !plat) { msg.textContent = "That doesn't look like a web link. Copy it from the app's Share button and paste it here."; msg.classList.add("err"); inp.setAttribute("aria-invalid", "true"); inp.focus(); return; }
    s.inspo.push({ id:newId("in"), group:g, type:"link", url, platform:plat, caption:"" });
    inp.value = ""; inp.removeAttribute("aria-invalid"); msg.classList.remove("err"); msg.textContent = plat + " link added. Write what it is below.";
    save(true); refreshGroup(g);
  }
  if (form.dataset.form === "styled") {
    const fd = new FormData(form), title = String(fd.get("title") || "").trim();
    if (!title) { document.getElementById("nf-title").focus(); return; }
    const id = "st" + Date.now().toString(36);
    S.sessions.push({ id, date:String(fd.get("date")), kind:"styled", ref:"", family:title, tab:title.split(" ").slice(0, 2).join(" "), start:String(fd.get("start")), end:"",
      city:String(fd.get("place") || "").trim(), bundle:"", backdrops:[], babies:[], addons:[], pick:"", said:"", confirm:[], extra:[], inspo:[] });
    save(true); location.hash = "#folder-" + id;
  }
});

/* ---------- start ---------- */
function start(fresh) {
  const saved = fresh ? null : load();
  S = saved || seed();
  if (!saved) { dayKeys("2026-11-05").forEach((k) => { S.ticks[k] = 1; }); save(true); }
  current = ""; render();
}
start(false);
</script>
